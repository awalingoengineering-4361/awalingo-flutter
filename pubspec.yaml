name: awalingo
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.0
  flutter_dotenv: ^5.2.1
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  http: ^1.2.0
  webview_flutter: ^4.10.0
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  passkeys: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/logo-mark-cropped.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/branding/
    - assets/illustrations/
    - assets/onboarding/

  fonts:
    - family: Parkinsans
      fonts:
        - asset: assets/fonts/Parkinsans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Parkinsans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Parkinsans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Parkinsans-Bold.ttf
          weight: 700

    - family: Metropolis
      fonts:
        - asset: assets/fonts/Metropolis-Regular.otf
          weight: 400
        - asset: assets/fonts/Metropolis-Medium.otf
          weight: 500
        - asset: assets/fonts/Metropolis-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Metropolis-Bold.otf
          weight: 700

    # Fallback for glyphs Parkinsans/Metropolis don't have: Yoruba's dotted
    # consonants/vowels (Ọ, Ṣ) and combining tone marks. Neither of the two
    # brand fonts covers these — Metropolis has zero combining-mark glyphs
    # at all — so without an explicit, controlled fallback, Skia silently
    # substitutes some other font per-glyph, and a combining mark rendered
    # via a different font than its base letter doesn't line up with that
    # letter's actual metrics, which is what caused diacritics to visually
    # detach/jump. Applied via fontFamilyFallback on dictionary/term/neo
    # content text specifically, not app UI chrome.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf