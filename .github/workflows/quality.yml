name: Quality

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Test CI quality runner
        run: bash test/workflows/ci_quality_test.sh

      - name: Run quality checks
        run: scripts/verify-ci

  store-backend:
    name: Store backend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test store authorization and fulfillment policy
        run: node --experimental-strip-types --test supabase/functions/_shared/*.test.ts supabase/functions/cowry-store-purchase/*.test.ts supabase/functions/cowry-store-reconcile/*.test.ts
      - name: Type-check Edge Functions
        run: npx --yes deno@2.9.6 check supabase/functions/cowry-store-purchase/index.ts supabase/functions/cowry-store-reconcile/index.ts
      - name: Test isolated refund database transactions
        run: bash test/database/store_refunds_test.sh
